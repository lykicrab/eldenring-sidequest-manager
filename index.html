<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>支线进度 · 支线管理</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="journey_catalog.js"></script>
  <script defer src="journey-core.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#next" aria-label="支线管理首页"><span class="brand-mark" aria-hidden="true">✦</span><span>支线管理<small>艾尔登法环 · 本体与黄金树幽影</small></span></a>
      <span id="offlineStatus" class="offline-status" role="status">离线缓存准备中</span>
    </div>
  </header>
  <main class="page">
    <p class="intro">完成一步，接着下一步。误勾时可到 NPC 个人进度中修改。</p>
    <div class="local-profile-bar"><label for="localProfile">当前周目</label><select id="localProfile" aria-label="当前周目"></select><button id="newProfile" type="button" class="secondary-button">新建周目</button><button id="cloneProfile" type="button" class="secondary-button" disabled>复制</button><button id="renameProfile" type="button" class="secondary-button" disabled>改名</button><button id="deleteProfile" type="button" class="secondary-button danger-button" disabled>删除</button><button id="importProfile" type="button" class="secondary-button">导入周目备份</button><button id="exportProfile" type="button" class="secondary-button" disabled>导出周目备份</button><input id="profileFile" type="file" accept=".json,application/json" multiple hidden><span id="localSaveStatus" role="status" aria-live="polite" hidden></span></div>
    <p id="profileMessage" class="profile-message" role="status" hidden></p>
    <nav class="view-tabs" aria-label="查看内容">
      <button type="button" data-view="next" class="active" aria-current="page">支线进度 <span id="nextCount"></span></button>
      <button type="button" data-view="npc">NPC 个人进度</button>
      <button type="button" data-view="collections">收集表</button>
    </nav>
    <section id="nextView" aria-label="各支线的下一步">
      <div id="progressWarning" class="step-warning" hidden></div>
      <section class="quests-section" aria-label="支线列表">
        <div class="quests-heading"><label class="search-field"><span aria-hidden="true">⌕</span><input id="questSearch" type="search" placeholder="搜索 NPC、地点或步骤" aria-label="搜索 NPC、地点或步骤"></label></div>
        <div class="filter-row"><div class="category-tabs" role="group" aria-label="游戏范围"><button type="button" data-category="all" class="active" aria-pressed="true">全部 <span id="allCount"></span></button><button type="button" data-category="base" aria-pressed="false">本体 <span id="baseCount"></span></button><button type="button" data-category="dlc" aria-pressed="false">黄金树幽影 <span id="dlcCount"></span></button></div><span class="filter-note">全部列表且清空搜索时，可拖动卡片排序</span></div>
        <div id="questGrid" class="quest-grid"></div>
        <details id="finishedSection" class="finished-section"><summary><span>已完成的支线</span><span id="finishedCount" class="count-badge"></span></summary><div id="finishedList" class="finished-list"></div></details>
      </section>
    </section>
    <section id="npcView" class="aux-view" hidden aria-labelledby="npcTitle"><div class="aux-heading"><div><p class="eyebrow">查看与修改</p><h2 id="npcTitle">NPC 个人进度</h2><p>选择支线结局，或在全部步骤中修改完成记录。</p></div><button type="button" class="secondary-button" data-back>返回支线进度</button></div><label class="npc-picker-label" for="npcPicker">查看 NPC<select id="npcPicker"></select></label><div id="choiceConflict" class="choice-conflict" role="alert" hidden></div><section id="npcDetail" class="npc-personal"></section></section>
    <section id="collectionsView" class="aux-view" hidden aria-labelledby="collectionTitle"><div class="aux-heading"><div><p class="eyebrow">辅助查看</p><h2 id="collectionTitle">支线收集表</h2><p>勾选表示本周目已经取得，交付后无需取消。收集与任务步骤分别保存。</p></div><button type="button" class="secondary-button" data-back>返回支线进度</button></div><div id="collectionList"></div></section>
    <p id="progressStatus" class="sr-only" role="status" aria-live="polite"></p>
    <footer class="page-footer"><span>支线管理 · 进度保存在当前浏览器</span><span>任务说明来自现有支线表</span></footer>
  </main>
  <button id="backToTop" class="back-to-top" type="button" aria-label="回到顶部" title="回到顶部" hidden>↑<span>回到顶部</span></button>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="profileNameDialog" aria-labelledby="profileNameTitle"><form id="profileNameForm">
    <h2 id="profileNameTitle">新建周目</h2>
    <label class="profile-name-label" for="profileName">周目名称<input id="profileName" maxlength="60" required autocomplete="off"></label>
    <fieldset id="newProfileRoutes"><legend>初始安排</legend><label><input id="newProfileBase" type="checkbox" checked>本体支线</label><label><input id="newProfileDlc" type="checkbox">黄金树幽影</label><p>之后可在 NPC 个人进度中调整分支与结局。</p></fieldset>
    <p id="profileNameError" class="step-warning" role="alert" hidden></p>
    <div class="profile-dialog-actions"><button id="cancelProfileName" type="button" class="secondary-button">取消</button><button type="submit" class="secondary-button primary-button">保存</button></div>
  </form></dialog>
  <dialog id="prerequisiteDialog" aria-labelledby="prerequisiteTitle" aria-describedby="prerequisiteTarget"><div class="prerequisite-dialog-heading"><h2 id="prerequisiteTitle">未完成的前置条件</h2><button id="closePrerequisites" type="button" class="dialog-close" aria-label="关闭前置条件">×</button></div><p id="prerequisiteTarget"></p><div id="prerequisiteList"></div><p class="condition-note">若共同条件已在游戏中达成，可在这里勾选确认。</p></dialog>
</body>
</html>
